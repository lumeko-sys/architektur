<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rollenkarten – Gebäudedienst</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f2ed; --bg2:#edeae4; --bg3:#e4e0d9;
  --card:#ffffff; --border:rgba(0,0,0,0.07); --bord2:rgba(0,0,0,0.14);
  --text:#1a1916; --muted:#7a7570; --hint:#b0ada8; --ink:#1a1916;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; line-height:1.6; display:flex; flex-direction:column; }

.topbar { background:var(--ink); padding:0 32px; height:52px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:300; }
.topbar-logo { font-family:'Syne',sans-serif; font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.45); }
.topbar-clock { font-family:'DM Mono',monospace; font-size:11px; color:rgba(255,255,255,.25); }

.nav-bar { background:var(--ink); border-bottom:1px solid rgba(255,255,255,.07); padding:0 32px; display:flex; gap:0; }
.nav-link { display:flex; align-items:center; gap:6px; padding:11px 14px; font-size:12px; font-weight:500; color:rgba(255,255,255,.38); text-decoration:none; border-bottom:2px solid transparent; transition:color .15s; white-space:nowrap; }
.nav-link:hover { color:rgba(255,255,255,.75); }
.nav-link.active { color:#fff; border-bottom-color:rgba(255,255,255,.55); }

.layout { display:flex; flex:1; overflow:hidden; height:calc(100vh - 104px); }

/* SIDEBAR */
.sidebar { width:248px; flex-shrink:0; background:var(--ink); display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; border-right:1px solid rgba(255,255,255,.05); }
.sb-head { padding:20px 20px 14px; border-bottom:1px solid rgba(255,255,255,.07); flex-shrink:0; }
.sb-eye { font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.28); margin-bottom:4px; }
.sb-count { font-family:'Syne',sans-serif; font-size:21px; font-weight:700; color:#fff; line-height:1; }
.sb-count em { color:rgba(255,255,255,.28); font-style:normal; font-size:13px; font-weight:400; margin-left:4px; }
.grp-lbl { font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.2); padding:12px 20px 4px; display:block; }
.grp-sep { border-top:1px solid rgba(255,255,255,.06); margin:4px 0; }
.rb { width:100%; display:flex; align-items:center; gap:11px; padding:8px 20px; background:none; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; transition:background .12s; text-align:left; border-left:2px solid transparent; }
.rb:hover { background:rgba(255,255,255,.05); }
.rb.active { background:rgba(255,255,255,.08); border-left-color:var(--rc,rgba(255,255,255,.4)); }
.rav { width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-size:11px; font-weight:700; flex-shrink:0; }
.rname { font-size:12px; font-weight:500; color:rgba(255,255,255,.78); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rrole { font-size:10px; color:rgba(255,255,255,.32); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* MAIN */
.main { flex:1; overflow-y:auto; background:var(--bg); padding:40px 52px 80px; }
.empty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
.eg { font-family:'Syne',sans-serif; font-size:52px; font-weight:700; color:var(--bg3); line-height:1; margin-bottom:4px; }
.et { font-family:'Syne',sans-serif; font-size:15px; font-weight:600; color:var(--muted); }
.es { font-size:13px; color:var(--hint); }

/* PROFILE */
.ph { display:flex; align-items:flex-start; gap:0; margin-bottom:34px; }
.ph-bar { width:4px; border-radius:4px; align-self:stretch; flex-shrink:0; margin-right:22px; min-height:76px; }
.ph-av { width:54px; height:54px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-size:16px; font-weight:700; flex-shrink:0; margin-right:18px; }
.ph-meta { flex:1; }
.ph-badge { display:inline-block; font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:20px; margin-bottom:7px; }
.ph-name { font-family:'Syne',sans-serif; font-size:25px; font-weight:700; color:var(--text); line-height:1.18; margin-bottom:6px; }
.ph-ziel { font-size:13px; color:var(--muted); max-width:520px; line-height:1.75; }
.ph-pills { display:flex; gap:5px; flex-wrap:wrap; margin-top:11px; }
.ph-pill { font-size:10px; padding:3px 9px; border-radius:20px; background:var(--bg2); border:1px solid var(--border); color:var(--muted); font-family:'DM Mono',monospace; }

/* KPIs */
.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:28px; }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:13px 15px; }
.kpi-v { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; color:var(--text); margin-bottom:3px; }
.kpi-l { font-size:11px; color:var(--muted); }

/* GRID */
.sg { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.full { grid-column:1/-1; }
.sc { background:var(--card); border:1px solid var(--border); border-radius:11px; padding:15px 17px; }
.sh { display:flex; align-items:center; gap:7px; margin-bottom:10px; }
.si { font-size:13px; line-height:1; }
.st { font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); flex:1; }
.ft { font-size:10px; font-weight:500; padding:2px 7px; border-radius:20px; }
.fd { background:rgba(200,80,80,.1); color:#b04040; }
.fw { background:rgba(160,130,50,.1); color:#907030; }
.fe { background:rgba(70,110,190,.1); color:#4060a0; }

.il { display:flex; flex-direction:column; gap:4px; }
.ir { display:flex; align-items:flex-start; gap:8px; padding:5px 8px; border-radius:7px; background:var(--bg); border:1px solid var(--border); font-size:12px; color:var(--text); line-height:1.5; }
.id { width:5px; height:5px; border-radius:50%; margin-top:5px; flex-shrink:0; }

.dl { display:flex; flex-direction:column; gap:4px; }
.dr { display:flex; align-items:center; gap:10px; padding:8px 11px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
.ds { flex:1; font-size:12px; color:var(--text); }
.db { font-size:10px; font-weight:500; padding:2px 8px; border-radius:20px; white-space:nowrap; }
.dg { background:rgba(50,140,90,.1); color:#206040; }
.da { background:rgba(160,130,50,.1); color:#806020; }
.dn { background:rgba(190,60,60,.1); color:#901818; }

.rl { display:flex; flex-direction:column; gap:4px; }
.ri { display:flex; align-items:flex-start; gap:9px; padding:9px 12px; border-radius:8px; font-size:12px; line-height:1.6; border:1px solid; }
.rg { background:rgba(50,140,90,.05); border-color:rgba(50,140,90,.18); color:#1a5030; }
.ra { background:rgba(160,130,50,.05); border-color:rgba(160,130,50,.18); color:#6a5010; }
.rr { background:rgba(190,60,60,.05); border-color:rgba(190,60,60,.18); color:#801818; }
.ricon { font-size:11px; flex-shrink:0; margin-top:2px; font-weight:700; }

.nl { display:flex; flex-wrap:wrap; gap:5px; }
.np { font-size:11px; font-weight:500; padding:4px 11px; border-radius:20px; background:rgba(190,60,60,.07); border:1px solid rgba(190,60,60,.18); color:#801818; }
.il2 { display:flex; flex-wrap:wrap; gap:5px; }
.ip { font-size:11px; padding:4px 11px; border-radius:20px; background:var(--bg2); border:1px solid var(--border); color:var(--muted); }

::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:2px; }
@keyframes si { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.ani { animation:si .22s ease forwards; }
</style>
</head>

const ricon = {g:'✓', a:'→', r:'✕'};

function sel(k) {
  document.querySelectorAll('.rb').forEach(b => b.classList.toggle('active', b.dataset.r === k));
  const d = R[k];
  document.getElementById('main').innerHTML = `<div class="ani">
    <div class="ph">
      <div class="ph-bar" style="background:${d.col}"></div>
      <div class="ph-av" style="background:${d.ab};color:${d.ac}">${d.in}</div>
      <div class="ph-meta">
        <div class="ph-badge" style="background:${d.bb};color:${d.bc}">${d.badge}</div>
        <div class="ph-name">${d.name}</div>
        <div class="ph-ziel">${d.ziel}</div>
        <div class="ph-pills">${d.pills.map(p=>`<span class="ph-pill">${p}</span>`).join('')}</div>
      </div>
    </div>
    <div class="kpis">${d.kpis.map(k=>`<div class="kpi" style="border-top:2px solid ${d.col}"><div class="kpi-v">${k.v}</div><div class="kpi-l">${k.l}</div></div>`).join('')}</div>
    <div class="sg">${d.secs.map(s=>`
      <div class="sc">
        <div class="sh"><span class="si">${s.i}</span><span class="st">${s.t}</span>${s.f?`<span class="ft ${s.fc}">${s.f}</span>`:''}</div>
        <div class="il">${s.items.map(it=>`<div class="ir"><div class="id" style="background:${d.col}"></div>${it}</div>`).join('')}</div>
      </div>`).join('')}</div>
    <div class="sg">
      <div class="sc full">
        <div class="sh"><span class="si">⚖</span><span class="st">Entscheidungsmatrix</span></div>
        <div class="dl">${d.decs.map(dec=>`<div class="dr"><span class="ds">${dec.s}</span><span class="db ${dec.c}">${dec.b}</span></div>`).join('')}</div>
      </div>
    </div>
    <div class="sg">
      <div class="sc full">
        <div class="sh"><span class="si">◧</span><span class="st">Kompetenzrahmen</span></div>
        <div class="rl">${d.rules.map(r=>`<div class="ri r${r.t}"><span class="ricon">${ricon[r.t]}</span>${r.x}</div>`).join('')}</div>
      </div>
    </div>
    <div class="sg">
      <div class="sc">
        <div class="sh"><span class="si">⚠</span><span class="st">No-Gos</span></div>
        <div class="nl">${d.nogos.map(n=>`<span class="np">${n}</span>`).join('')}</div>
      </div>
      <div class="sc">
        <div class="sh"><span class="si">◎</span><span class="st">Schnittstellen</span></div>
        <div class="il2">${d.ifaces.map(i=>`<span class="ip">${i}</span>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

function updateClock() {
  const n=new Date();
  const d=['So','Mo','Di','Mi','Do','Fr','Sa'][n.getDay()];
  document.getElementById('clock').textContent=`${d} ${n.toLocaleDateString('de-DE',{day:'numeric',month:'short'})} · ${n.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}`;
}
updateClock(); setInterval(updateClock,30000);
</script>
