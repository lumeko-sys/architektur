<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organigramm – Gebäudedienst</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--bg2:#141414;--bg3:#1c1c1c;--bg4:#242424;--border:rgba(255,255,255,0.07);--bord2:rgba(255,255,255,0.13);--text:#ede9e3;--muted:#7a7672;--hint:#3e3c3a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;display:flex;flex-direction:column;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;}
.topbar-logo{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.topbar-clock{font-family:'DM Mono',monospace;font-size:12px;color:var(--hint);}
.nav-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;display:flex;gap:2px;}
.nav-link{display:flex;align-items:center;gap:7px;padding:12px 14px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--text);border-bottom-color:var(--text);}
.nav-icon{font-size:14px;}

.layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 104px);}

/* CHART AREA */
.chart-area{flex:1;overflow:auto;padding:40px 32px 60px;display:flex;flex-direction:column;align-items:center;}

.page-head{width:100%;max-width:860px;margin-bottom:32px;}
.page-eyebrow{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.page-title{font-size:24px;font-weight:300;color:var(--text);}
.page-title strong{font-weight:600;}

/* ORG TREE */
.org-tree{display:flex;flex-direction:column;align-items:center;gap:0;width:100%;max-width:860px;}

.tier{display:flex;justify-content:center;gap:12px;width:100%;position:relative;}
.tier+.tier{margin-top:0;}

/* connector lines */
.connector-v{width:1px;height:28px;background:var(--bord2);margin:0 auto;}
.connector-h-wrap{position:relative;display:flex;justify-content:center;margin-bottom:0;}
.connector-h{height:1px;background:var(--bord2);position:absolute;top:0;}

.branch-down-wrap{display:flex;flex-direction:column;align-items:center;width:100%;}
.branch-stems{display:flex;justify-content:center;gap:12px;width:100%;}
.branch-stem{display:flex;flex-direction:column;align-items:center;}
.stem-line{width:1px;height:28px;background:var(--bord2);}

/* NODE CARD */
.org-node{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;cursor:pointer;transition:border-color .15s,background .15s;
  min-width:130px;max-width:170px;text-align:center;position:relative;
  border-top:2px solid var(--accent,var(--border));
  flex-shrink:0;
}
.org-node:hover{border-color:var(--bord2);background:var(--bg3);}
.org-node.selected{border-color:var(--accent,var(--bord2));background:var(--bg3);}

.node-initials{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;margin:0 auto 7px;
}
.node-title{font-size:12px;font-weight:500;color:var(--text);line-height:1.3;}
.node-sub{font-size:10px;color:var(--muted);margin-top:2px;}

/* DETAIL PANEL */
.detail-panel{
  width:300px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);
  overflow-y:auto;padding:28px 22px;
}
.dp-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;}
.dp-eyebrow{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.dp-name{font-size:18px;font-weight:500;color:var(--text);margin-bottom:4px;}
.dp-sub{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.6;}
.dp-badge{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:14px;}

.dp-section{margin-bottom:18px;}
.dp-sec-title{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--hint);margin-bottom:7px;}
.dp-list{display:flex;flex-direction:column;gap:4px;}
.dp-item{font-size:12px;color:var(--muted);display:flex;align-items:flex-start;gap:7px;padding:5px 8px;background:var(--bg3);border-radius:6px;}
.dp-dot{width:4px;height:4px;border-radius:50%;margin-top:5px;flex-shrink:0;}

.dp-chip-row{display:flex;flex-wrap:wrap;gap:5px;}
.dp-chip{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);}

.reports-to{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg3);border-radius:8px;border:1px solid var(--border);font-size:12px;color:var(--muted);}
.reports-arrow{color:var(--hint);}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--hint);border-radius:2px;}

@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.dp-ani{animation:fi .18s ease forwards;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">Intranet · Gebäudedienst</div>
  <div class="topbar-clock" id="clock"></div>
</div>

<nav class="nav-bar">
  <a class="nav-link" href="index.html"><span class="nav-icon">⌂</span>Start</a>
  <a class="nav-link" href="rollenkarten.html"><span class="nav-icon">◫</span>Rollenkarten</a>
  <a class="nav-link active" href="organigramm.html"><span class="nav-icon">◈</span>Organigramm</a>
  <a class="nav-link" href="checklisten.html"><span class="nav-icon">✓</span>Checklisten</a>
  <a class="nav-link" href="schwarzesbrett.html"><span class="nav-icon">◉</span>Schwarzes Brett</a>
</nav>

<div class="layout">
  <div class="chart-area">
    <div class="page-head">
      <div class="page-eyebrow">Struktur</div>
      <div class="page-title">Interaktives <strong>Organigramm</strong></div>
    </div>

    <div class="org-tree" id="tree"></div>
  </div>

  <aside class="detail-panel" id="detail-panel">
    <div class="dp-empty" id="dp-empty">
      <div style="font-size:28px;opacity:.3">◈</div>
      <div style="font-size:14px;font-weight:500;color:var(--text)">Position auswählen</div>
      <div style="font-size:12px">Klicke auf einen Knoten.</div>
    </div>
    <div id="dp-content" style="display:none"></div>
  </aside>
</div>

<script>
const NODES = {
  gf1:  {initials:'G1',title:'GF 1',sub:'Operatives Geschäft',acc:'#b8b2f0',avBg:'rgba(127,119,221,.25)',
    badge:'Geschäftsführung',badgeBg:'rgba(127,119,221,.2)',badgeCol:'#b8b2f0',
    reportsTo:'—',leads:['bl','vtl'],
    aufgaben:['Steuerung Betriebsleitung','Prozesse & Standards','Eskalationsentscheide','Qualitätskontrolle','Systemweiterentwicklung'],
    kpis:['Reklamationsquote','Auslastung','Personalstabilität'],
    nogos:['Eingriff ins Tagesgeschäft','Direkte Mitarbeitersteuerung']},
  gf2:  {initials:'G2',title:'GF 2',sub:'Kaufmännisch',acc:'#6dd4ab',avBg:'rgba(29,158,117,.25)',
    badge:'Geschäftsführung',badgeBg:'rgba(29,158,117,.2)',badgeCol:'#6dd4ab',
    reportsTo:'—',leads:['verw'],
    aufgaben:['Lohnabrechnung','Buchhaltung','Vertragsmanagement','Liquiditätsplanung','Kostenkontrolle'],
    kpis:['Liquidität','Gewinnmarge','Lohnquote'],
    nogos:['Operative Einmischung','Fehlende Kontrolle']},
  vtl:  {initials:'VL',title:'Vertriebsleitung',sub:'Vertriebsteam steuern',acc:'#e090b4',avBg:'rgba(212,83,126,.25)',
    badge:'Vertrieb',badgeBg:'rgba(212,83,126,.2)',badgeCol:'#e090b4',
    reportsTo:'GF 1',leads:['bzl','vtma'],
    aufgaben:['Team führen','Angebotsprozesse','Lead-Verfolgung','Vertriebsstruktur aufbauen'],
    kpis:['Abschlussquote','Angebotsdurchlauf','Umsatzentwicklung'],
    nogos:['Fehlende Struktur','Keine Kontrolle']},
  bl:   {initials:'BL',title:'Betriebsleitung',sub:'Operativer Ablauf',acc:'#7ab8e8',avBg:'rgba(55,138,221,.25)',
    badge:'Betrieb',badgeBg:'rgba(55,138,221,.2)',badgeCol:'#7ab8e8',
    reportsTo:'GF 1',leads:['disp','ob','bm'],
    aufgaben:['Disposition steuern','Objektbetreuer führen','Probleme lösen','Qualität sichern'],
    kpis:['Störungsquote','Ausfälle','Qualität'],
    nogos:['Chaos tolerieren','Probleme weiterreichen']},
  bzl:  {initials:'BZ',title:'Bezirksleitung Vertrieb',sub:'Gebiet & Kunden',acc:'#e0b880',avBg:'rgba(212,160,80,.25)',
    badge:'Vertrieb',badgeBg:'rgba(212,160,80,.2)',badgeCol:'#e0b880',
    reportsTo:'Vertriebsleitung',leads:[],
    aufgaben:['Neukundenakquise','Bestandskunden','Angebotsverhandlungen','Marktanalyse'],
    kpis:['Umsatz Gebiet','Abschlussquote','Kundenzufriedenheit'],
    nogos:['Unstrukturierter Vertrieb','Kein Nachfassen']},
  vtma: {initials:'VM',title:'Vertrieb MA',sub:'Aktiver Tagesvertrieb',acc:'#e0a0c8',avBg:'rgba(200,100,160,.25)',
    badge:'Vertrieb',badgeBg:'rgba(200,100,160,.2)',badgeCol:'#e0a0c8',
    reportsTo:'Vertriebsleitung',leads:[],
    aufgaben:['Erstkontakt','Termine','Angebote vorbereiten','Nachfassen'],
    kpis:['Termine','Angebote','Abschlüsse'],
    nogos:['Kein Follow-up','Schlechte Doku']},
  disp: {initials:'DI',title:'Disponent',sub:'Einsatzplanung',acc:'#e8c060',avBg:'rgba(232,180,80,.25)',
    badge:'Betrieb',badgeBg:'rgba(232,180,80,.2)',badgeCol:'#e8c060',
    reportsTo:'Betriebsleitung',leads:[],
    aufgaben:['Dienstplanung','Ausfälle managen','Vertretung organisieren'],
    kpis:['Offene Einsätze','Reaktionszeit','Planungsvorschau'],
    nogos:['Unbesetzte Objekte']},
  ob:   {initials:'OB',title:'Objektbetreuer',sub:'Qualität vor Ort',acc:'#f0a070',avBg:'rgba(240,140,80,.25)',
    badge:'Betrieb',badgeBg:'rgba(240,140,80,.2)',badgeCol:'#f0a070',
    reportsTo:'Betriebsleitung',leads:[],
    aufgaben:['Kontrollen','Reklamationen','Mitarbeiterführung vor Ort','Material prüfen'],
    kpis:['Reklamationsquote','Qualitätsbewertung','Reaktionszeit'],
    nogos:['Probleme ignorieren']},
  bm:   {initials:'BM',title:'Beschwerdemanagement',sub:'Tickets & Kundenfeedback',acc:'#80c8d8',avBg:'rgba(80,180,200,.25)',
    badge:'Betrieb',badgeBg:'rgba(80,180,200,.2)',badgeCol:'#80c8d8',
    reportsTo:'Betriebsleitung',leads:[],
    aufgaben:['Beschwerden erfassen','Tickets zuweisen','Fristen überwachen','Kundenfeedback koordinieren','Muster auswerten'],
    kpis:['Reaktionszeit <24h','Lösungszeit','Wiederholungsquote'],
    nogos:['Keine Dokumentation','Keine Rückmeldung']},
  verw: {initials:'VW',title:'Verwaltung',sub:'Admin & Entlastung',acc:'#d0a0e0',avBg:'rgba(180,120,200,.25)',
    badge:'Support',badgeBg:'rgba(180,120,200,.2)',badgeCol:'#d0a0e0',
    reportsTo:'GF 2',leads:[],
    aufgaben:['Rechnungen','Angebote Standard','Datenpflege','Abwesenheiten'],
    kpis:['Bearbeitungszeit','Fehlerquote','Offene Posten'],
    nogos:['Datenchaos']},
  mat:  {initials:'ML',title:'Material & Wäsche',sub:'Logistik & Versorgung',acc:'#a0c8a0',avBg:'rgba(120,180,120,.25)',
    badge:'Support',badgeBg:'rgba(120,180,120,.2)',badgeCol:'#a0c8a0',
    reportsTo:'Betriebsleitung',leads:[],
    aufgaben:['Material liefern','Wäsche aufbereiten','Lagerbestand prüfen'],
    kpis:['Materialverfügbarkeit','Reklamationen durch Material','Touren abgeschlossen'],
    nogos:['Leere Objekte']},
  bg:   {initials:'BG',title:'Bereichsleitung Garten',sub:'Garten & Außenanlagen',acc:'#90d870',avBg:'rgba(100,200,80,.25)',
    badge:'Betrieb',badgeBg:'rgba(100,200,80,.2)',badgeCol:'#90d870',
    reportsTo:'Betriebsleitung',leads:[],
    aufgaben:['Garteneinsätze planen & koordinieren','Gartenmitarbeiter führen','Qualität vor Ort kontrollieren','Mähzyklen & Mülltonnendienst sicherstellen','Material & Geräte planen'],
    kpis:['Mähintervalle eingehalten','Reklamationen Garten','Auslastung Teams'],
    nogos:['Unkoordinierte Einsätze','Verpasste Termine','Keine Qualitätskontrolle']},
};

// Build tree HTML
function node(key){
  const n=NODES[key];
  return `<div class="org-node" id="node-${key}" style="--accent:${n.acc}" onclick="selectNode('${key}')">
    <div class="node-initials" style="background:${n.avBg};color:${n.acc}">${n.initials}</div>
    <div class="node-title">${n.title}</div>
    <div class="node-sub">${n.sub}</div>
  </div>`;
}

function vLine(){ return `<div class="connector-v"></div>`; }

function buildTree(){
  const t = document.getElementById('tree');
  t.innerHTML = `
    <!-- L1: GF -->
    <div class="tier">${node('gf1')}${node('gf2')}</div>

    <!-- connector GF1 down -->
    <div style="display:flex;justify-content:center;gap:0;width:100%;max-width:860px">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center">
        ${vLine()}
        <!-- H line across BL + VTL -->
        <div style="position:relative;width:100%;height:1px;margin-bottom:0">
          <div style="position:absolute;left:25%;right:25%;height:1px;background:var(--bord2);top:0"></div>
        </div>
        <div style="display:flex;justify-content:center;gap:0;width:100%">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center">${vLine()}</div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center">${vLine()}</div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;width:100%">
          ${node('bl')}${node('vtl')}
        </div>
      </div>
      <!-- GF2 line down -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center">
        ${vLine()}
        ${node('verw')}
      </div>
    </div>

    <!-- BL children -->
    <div style="display:flex;width:100%;max-width:860px">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center">
        ${vLine()}
        <!-- H line -->
        <div style="position:relative;width:80%;height:1px">
          <div style="position:absolute;left:5%;right:5%;height:1px;background:var(--bord2);top:0"></div>
        </div>
        <div style="display:flex;gap:12px;width:80%;justify-content:center">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center">${vLine()}${node('disp')}</div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center">${vLine()}${node('ob')}</div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center">${vLine()}${node('bm')}</div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center">${vLine()}${node('mat')}</div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center">${vLine()}${node('bg')}</div>
        </div>
      </div>
      <!-- VTL children -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center">
        ${vLine()}
        <div style="position:relative;width:70%;height:1px">
          <div style="position:absolute;left:15%;right:15%;height:1px;background:var(--bord2);top:0"></div>
        </div>
        <div style="display:flex;gap:12px;width:70%;justify-content:center">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center">${vLine()}${node('bzl')}</div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center">${vLine()}${node('vtma')}</div>
        </div>
      </div>
      <!-- GF2 spacer -->
      <div style="flex:1"></div>
    </div>
  `;
}

function selectNode(key){
  document.querySelectorAll('.org-node').forEach(n=>n.classList.remove('selected'));
  document.getElementById('node-'+key).classList.add('selected');
  const d=NODES[key];
  document.getElementById('dp-empty').style.display='none';
  const c=document.getElementById('dp-content');
  c.style.display='block';
  c.className='dp-ani';
  void c.offsetWidth;
  c.className='dp-ani';
  c.innerHTML=`
    <div class="dp-eyebrow">${d.badge}</div>
    <div class="dp-badge" style="background:${d.badgeBg};color:${d.badgeCol}">${d.badge}</div>
    <div class="dp-name">${d.title}</div>
    <div class="dp-sub">${d.sub}</div>

    <div class="dp-section">
      <div class="dp-sec-title">Berichtet an</div>
      <div class="reports-to">
        <span class="reports-arrow">↑</span>
        <span>${d.reportsTo}</span>
      </div>
    </div>

    ${d.leads.length ? `
    <div class="dp-section">
      <div class="dp-sec-title">Führt direkt</div>
      <div class="dp-chip-row">
        ${d.leads.map(l=>`<span class="dp-chip">${NODES[l].title}</span>`).join('')}
      </div>
    </div>` : ''}

    <div class="dp-section">
      <div class="dp-sec-title">Kernaufgaben</div>
      <div class="dp-list">
        ${d.aufgaben.map(a=>`<div class="dp-item"><div class="dp-dot" style="background:${d.acc}"></div>${a}</div>`).join('')}
      </div>
    </div>

    <div class="dp-section">
      <div class="dp-sec-title">KPIs</div>
      <div class="dp-chip-row">
        ${d.kpis.map(k=>`<span class="dp-chip">${k}</span>`).join('')}
      </div>
    </div>

    <div class="dp-section">
      <div class="dp-sec-title">No-Gos</div>
      <div class="dp-list">
        ${d.nogos.map(n=>`<div class="dp-item" style="color:#d48a8a"><div class="dp-dot" style="background:#d48a8a"></div>${n}</div>`).join('')}
      </div>
    </div>

    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <a href="rollenkarten.html" style="font-size:12px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .15s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">
        <span>→</span> Vollständige Rollenkarte öffnen
      </a>
    </div>
  `;
}

buildTree();

function updateClock(){
  const n=new Date();
  const d=['So','Mo','Di','Mi','Do','Fr','Sa'][n.getDay()];
  const t=n.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  const dt=n.toLocaleDateString('de-DE',{day:'numeric',month:'short'});
  document.getElementById('clock').textContent=`${d} ${dt} · ${t}`;
}
updateClock(); setInterval(updateClock,30000);
</script>
</body>
</html>
