<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklisten – Gebäudedienst</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--bg2:#141414;--bg3:#1c1c1c;--bg4:#242424;--border:rgba(255,255,255,0.07);--bord2:rgba(255,255,255,0.13);--text:#ede9e3;--muted:#7a7672;--hint:#3e3c3a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;display:flex;flex-direction:column;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;}
.topbar-logo{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.topbar-clock{font-family:'DM Mono',monospace;font-size:12px;color:var(--hint);}
.nav-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;display:flex;gap:2px;}
.nav-link{display:flex;align-items:center;gap:7px;padding:12px 14px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--text);border-bottom-color:var(--text);}
.nav-icon{font-size:14px;}

.layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 104px);}

/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
.sb-head{padding:18px 16px 12px;border-bottom:1px solid var(--border);}
.sb-title{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.sb-date{font-size:13px;font-weight:500;color:var(--text);}
.grp-lbl{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--hint);padding:10px 16px 4px;display:block;}
.grp-sep{border-top:1px solid var(--border);margin-top:4px;}
.role-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 16px;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .12s;text-align:left;border-left:2px solid transparent;}
.role-btn:hover{background:var(--bg3);}
.role-btn.active{background:var(--bg3);border-left-color:var(--acc,#888);}
.rav{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;}
.rinfo{flex:1;min-width:0;}
.rname{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rsub{font-size:10px;color:var(--muted);}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:32px 40px 80px;}

.page-head{margin-bottom:24px;}
.page-eyebrow{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.page-title{font-size:22px;font-weight:300;color:var(--text);}
.page-title strong{font-weight:600;}

/* PROGRESS */
.prog-row{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:24px;}
.prog-lbl{font-size:12px;color:var(--muted);white-space:nowrap;}
.prog-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;background:var(--text);transition:width .4s ease;}
.prog-count{font-family:'DM Mono',monospace;font-size:13px;color:var(--text);white-space:nowrap;}

/* SECTIONS */
.section{margin-bottom:24px;}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.sec-title{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.freq-tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;letter-spacing:.03em;}
.f-daily{background:rgba(210,90,90,.14);color:#d48a8a;}
.f-weekly{background:rgba(210,170,80,.14);color:#d4c07a;}
.f-event{background:rgba(90,140,210,.14);color:#82a8d4;}

.task-list{display:flex;flex-direction:column;gap:5px;}
.task-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;cursor:pointer;transition:background .12s,border-color .12s;user-select:none;}
.task-item:hover{background:var(--bg3);border-color:var(--bord2);}
.task-item.done{opacity:.4;}
.task-item.done .task-text{text-decoration:line-through;color:var(--muted);}
.checkbox{width:18px;height:18px;border:1.5px solid var(--bord2);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.task-item.done .checkbox{background:rgba(255,255,255,.12);border-color:transparent;}
.checkmark{display:none;width:10px;height:10px;}
.task-item.done .checkmark{display:block;}
.task-text{font-size:13px;color:var(--text);}

/* ACTIONS ROW */
.action-row{display:flex;gap:8px;margin-top:24px;}
.btn-reset{font-size:12px;color:var(--hint);background:none;border:1px solid var(--border);border-radius:7px;padding:7px 14px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.btn-reset:hover{color:var(--muted);border-color:var(--bord2);}

/* EMPTY */
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);}

::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--hint);border-radius:2px;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ani{animation:fi .2s ease forwards;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">Intranet · Gebäudedienst</div>
  <div class="topbar-clock" id="clock"></div>
</div>

<nav class="nav-bar">
  <a class="nav-link" href="index.html"><span class="nav-icon">⌂</span>Start</a>
  <a class="nav-link" href="rollenkarten.html"><span class="nav-icon">◫</span>Rollenkarten</a>
  <a class="nav-link" href="organigramm.html"><span class="nav-icon">◈</span>Organigramm</a>
  <a class="nav-link active" href="checklisten.html"><span class="nav-icon">✓</span>Checklisten</a>
  <a class="nav-link" href="schwarzesbrett.html"><span class="nav-icon">◉</span>Schwarzes Brett</a>
</nav>

<div class="layout">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-title">Checklisten</div>
      <div class="sb-date" id="sb-date"></div>
    </div>
    <span class="grp-lbl">Führung</span>
    <button class="role-btn" data-r="gf1" onclick="selRole('gf1')" style="--acc:#b8b2f0"><div class="rav" style="background:rgba(127,119,221,.2);color:#b8b2f0">G1</div><div class="rinfo"><div class="rname">GF 1 – Operativ</div><div class="rsub">Strategie</div></div></button>
    <button class="role-btn" data-r="gf2" onclick="selRole('gf2')" style="--acc:#6dd4ab"><div class="rav" style="background:rgba(29,158,117,.2);color:#6dd4ab">G2</div><div class="rinfo"><div class="rname">GF 2 – Kaufmännisch</div><div class="rsub">Finanzen</div></div></button>
    <div class="grp-sep"></div>
    <span class="grp-lbl">Vertrieb</span>
    <button class="role-btn" data-r="vtl" onclick="selRole('vtl')" style="--acc:#e090b4"><div class="rav" style="background:rgba(212,83,126,.2);color:#e090b4">VL</div><div class="rinfo"><div class="rname">Vertriebsleitung</div><div class="rsub">Team & Pipeline</div></div></button>
    <button class="role-btn" data-r="bzl" onclick="selRole('bzl')" style="--acc:#e0b880"><div class="rav" style="background:rgba(212,160,80,.2);color:#e0b880">BZ</div><div class="rinfo"><div class="rname">Bezirksleitung</div><div class="rsub">Gebiet & Kunden</div></div></button>
    <button class="role-btn" data-r="vtma" onclick="selRole('vtma')" style="--acc:#e0a0c8"><div class="rav" style="background:rgba(200,100,160,.2);color:#e0a0c8">VM</div><div class="rinfo"><div class="rname">Vertrieb MA</div><div class="rsub">Tagesvertrieb</div></div></button>
    <div class="grp-sep"></div>
    <span class="grp-lbl">Betrieb</span>
    <button class="role-btn" data-r="bl" onclick="selRole('bl')" style="--acc:#7ab8e8"><div class="rav" style="background:rgba(55,138,221,.2);color:#7ab8e8">BL</div><div class="rinfo"><div class="rname">Betriebsleitung</div><div class="rsub">Tagessteuerung</div></div></button>
    <button class="role-btn" data-r="disp" onclick="selRole('disp')" style="--acc:#e8c060"><div class="rav" style="background:rgba(232,180,80,.2);color:#e8c060">DI</div><div class="rinfo"><div class="rname">Disponent</div><div class="rsub">Einsatzplanung</div></div></button>
    <button class="role-btn" data-r="ob" onclick="selRole('ob')" style="--acc:#f0a070"><div class="rav" style="background:rgba(240,140,80,.2);color:#f0a070">OB</div><div class="rinfo"><div class="rname">Objektbetreuer</div><div class="rsub">Qualität vor Ort</div></div></button>
    <button class="role-btn" data-r="bm" onclick="selRole('bm')" style="--acc:#80c8d8"><div class="rav" style="background:rgba(80,180,200,.2);color:#80c8d8">BM</div><div class="rinfo"><div class="rname">Beschwerdemgmt.</div><div class="rsub">Tickets</div></div></button>
    <button class="role-btn" data-r="bg" onclick="selRole('bg')" style="--acc:#90d870"><div class="rav" style="background:rgba(100,200,80,.2);color:#90d870">BG</div><div class="rinfo"><div class="rname">Bereichsl. Garten</div><div class="rsub">Garten & Außen</div></div></button>
    <div class="grp-sep"></div>
    <span class="grp-lbl">Support</span>
    <button class="role-btn" data-r="verw" onclick="selRole('verw')" style="--acc:#d0a0e0"><div class="rav" style="background:rgba(180,120,200,.2);color:#d0a0e0">VW</div><div class="rinfo"><div class="rname">Verwaltung</div><div class="rsub">Admin</div></div></button>
    <button class="role-btn" data-r="mat" onclick="selRole('mat')" style="--acc:#a0c8a0"><div class="rav" style="background:rgba(120,180,120,.2);color:#a0c8a0">ML</div><div class="rinfo"><div class="rname">Material & Wäsche</div><div class="rsub">Logistik</div></div></button>
  </aside>

  <main class="main" id="main">
    <div class="empty">
      <div style="font-size:28px;opacity:.3">✓</div>
      <div style="font-size:14px;font-weight:500;color:var(--text)">Rolle auswählen</div>
      <div style="font-size:12px">Klicke links auf eine Position.</div>
    </div>
  </main>
</div>

<script>
const CHECKLISTS = {
  gf1:{name:'GF 1 – Operativ',acc:'#b8b2f0',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Wochenbericht Betriebsleitung gelesen?','1:1 mit Betriebsleitung eingeplant?','Kritische Eskalationen geprüft?','Eigene Top-3-Prioritäten definiert?']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Qualitäts-KPIs ausgewertet','Auslastungsanalyse gemacht','Strategieanpassung operativ besprochen','Monatliche Zahlen im Blick?']},
  ]},
  gf2:{name:'GF 2 – Kaufmännisch',acc:'#6dd4ab',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Zahlungsströme geprüft','Offene Rückfragen geklärt','Liquiditätsstatus im Blick']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Liquiditätsübersicht erstellt','Kostenanalyse durchgeführt','Lohnabrechnung kontrolliert','Steuerberater-Abstimmung geplant']},
  ]},
  vtl:{name:'Vertriebsleitung',acc:'#e090b4',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Pipeline geprüft','Team gebrieft','Offene Angebote nachgefasst']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Vertriebszahlen analysiert','Abstimmung mit GF','Teamgespräch geführt','Abschlussquote bewertet']},
  ]},
  bzl:{name:'Bezirksleitung Vertrieb',acc:'#e0b880',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Min. 2 Kundenkontakte','Termine wahrgenommen','Laufende Angebote nachgefasst']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Pipeline-Auswertung gemacht','Bestandskunden kontaktiert','Umsatzziel auf Kurs?','Markt beobachtet']},
  ]},
  vtma:{name:'Vertrieb MA',acc:'#e0a0c8',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Min. 2 Neukontakte hergestellt','Offene Angebote verfolgt','Termine dokumentiert']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Pipeline aktualisiert','Wochenbericht an VL','Absagen dokumentiert & analysiert']},
  ]},
  bl:{name:'Betriebsleitung',acc:'#7ab8e8',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Morgenbriefing mit Disponenten (10 Min)','Einsatzlage: alle Objekte besetzt?','Reklamationen Stufe 2 bearbeitet','Tagesabschluss dokumentiert']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['2–3 Stichprobenkontrollen in Objekten','Begehungsprotokolle reviewt','1:1 mit Objektbetreuern','Wochenbericht an GF 1 gesendet']},
  ]},
  disp:{name:'Disponent',acc:'#e8c060',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Briefing mit BL (10 Min)','Krankmeldungen verarbeitet','Alle Objekte für heute besetzt?','Dienstplan morgen fertig & versendet','Änderungen kommuniziert']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Urlaubsanträge geprüft & genehmigt','Stundenzettel gesammelt & an Verwaltung','Engpässe nächste 4 Wochen erkannt','Touren & Saisonplanung aktuell']},
  ]},
  ob:{name:'Objektbetreuer',acc:'#f0a070',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Begehung in Objekten durchgeführt','Protokoll ausgefüllt & abgelegt','Kleinstprobleme vor Ort gelöst','Mitarbeiter eingewiesen']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Materialbestand in Objekten geprüft','Nachbestellung gemeldet (>100 € → Verwaltung)','Offene Reklamationen abgeschlossen']},
  ]},
  bm:{name:'Beschwerdemanagement',acc:'#80c8d8',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Neue Beschwerden erfasst','Tickets erstellt & zugewiesen','Status offener Tickets geprüft','Rückmeldungen an Kunden koordiniert']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Beschwerde-Auswertung: Muster erkannt?','Abstimmung mit Betriebsleitung bei Auffälligkeiten','Reaktionszeiten kontrolliert (<24h)','Wiederholungsquote analysiert']},
  ]},
  verw:{name:'Verwaltung',acc:'#d0a0e0',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['E-Mails bearbeitet','Dokumente abgelegt','Telefoneingang weitergeleitet']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Stundenzettel erfasst & geprüft','Rechnungen vorbereitet & versendet','Offene Posten geprüft','Wochenbericht an BL / GF 2']},
  ]},
  mat:{name:'Material & Wäsche',acc:'#a0c8a0',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Touren gefahren: alle Objekte versorgt?','Wäsche aufbereitet & ausgeliefert','Engpässe sofort gemeldet']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Lagerbestand geprüft','Nachbestellbedarf an Verwaltung','Leere Objekte: keine offen']},
  ]},
  bg:{name:'Bereichsleitung Garten',acc:'#90d870',sections:[
    {title:'Täglich',freq:'täglich',fc:'f-daily',tasks:['Überblick über laufende Garteneinsätze','Abstimmung mit Disponent bei Änderungen / Ausfällen','Probleme vor Ort geklärt','Rückmeldungen aus Teams aufgenommen']},
    {title:'Wöchentlich',freq:'wöchentlich',fc:'f-weekly',tasks:['Touren und Einsatzplanung optimiert','Ausgewählte Objekte kontrolliert','Abstimmung mit Betriebsleitung','Personal- und Materialbedarf gemeldet','Mähintervalle & Mülltonnendienst auf Kurs?']},
  ]},
};

let cur=null, state={};

function selRole(key){
  cur=key;
  if(!state[key]) state[key]={};
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active',b.dataset.r===key));
  renderChecklist();
}

function renderChecklist(){
  const d=CHECKLISTS[cur];
  const main=document.getElementById('main');
  const allKeys=[];
  d.sections.forEach((s,si)=>s.tasks.forEach((_,ti)=>allKeys.push(`${si}-${ti}`)));
  allKeys.forEach(k=>{ if(state[cur][k]===undefined) state[cur][k]=false; });
  const done=allKeys.filter(k=>state[cur][k]).length;
  const total=allKeys.length;
  const pct=total?Math.round(done/total*100):0;

  main.innerHTML=`<div class="ani">
    <div class="page-head">
      <div class="page-eyebrow">Checkliste</div>
      <div class="page-title"><strong>${d.name}</strong></div>
    </div>
    <div class="prog-row">
      <div class="prog-lbl">Fortschritt heute</div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-count">${done} / ${total}</div>
    </div>
    ${d.sections.map((s,si)=>`
      <div class="section">
        <div class="sec-head">
          <div class="sec-title">${s.title}</div>
          <span class="freq-tag ${s.fc}">${s.freq}</span>
        </div>
        <div class="task-list">
          ${s.tasks.map((t,ti)=>{
            const k=`${si}-${ti}`;
            const done=state[cur][k];
            return `<div class="task-item${done?' done':''}" onclick="toggle('${k}')">
              <div class="checkbox">
                <svg class="checkmark" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1.5 5L4 7.5L8.5 2.5" stroke="rgba(255,255,255,.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <div class="task-text">${t}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `).join('')}
    <div class="action-row">
      <button class="btn-reset" onclick="resetAll()">Alle zurücksetzen</button>
    </div>
  </div>`;
}

function toggle(k){
  state[cur][k]=!state[cur][k];
  renderChecklist();
}
function resetAll(){
  Object.keys(state[cur]).forEach(k=>state[cur][k]=false);
  renderChecklist();
}

function updateClock(){
  const n=new Date();
  const days=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const d=days[n.getDay()];
  const t=n.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  const dt=n.toLocaleDateString('de-DE',{day:'numeric',month:'long'});
  document.getElementById('clock').textContent=`${['So','Mo','Di','Mi','Do','Fr','Sa'][n.getDay()]} ${n.toLocaleDateString('de-DE',{day:'numeric',month:'short'})} · ${t}`;
  document.getElementById('sb-date').textContent=`${d}, ${dt}`;
}
updateClock(); setInterval(updateClock,30000);
</script>
</body>
</html>
